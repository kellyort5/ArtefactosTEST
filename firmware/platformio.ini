[platformio]
default_envs = sentinel_s3

[env:sentinel_s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_upload.maximum_size = 16777216
board_build.psram_type = opi
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -DSENTINEL_VERSION=\"0.1.0\"

platform_packages =
    platformio/framework-espidf@3.50503.0
    platformio/toolchain-xtensa-esp-elf@14.2.0+20251107
    platformio/toolchain-riscv32-esp@14.2.0+20251107
    platformio/toolchain-esp32ulp@1.23800.240113
    espressif/tool-xtensa-esp-elf-gdb@12.1.0+20221002
    espressif/tool-riscv32-esp-elf-gdb@12.1.0+20221002
    platformio/tool-esptoolpy@2.41100.260830
    platformio/tool-cmake@3.30.2
    platformio/tool-ninja@1.7.1
    platformio/tool-esp-rom-elfs@0.0.1+20241011

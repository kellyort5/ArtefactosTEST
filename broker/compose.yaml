name: sentinel-core
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/sentinel/entrypoint.sh"]
    ports:
      - "${SENTINEL_BIND_IP:-127.0.0.1}:8883:8883"
      - "${SENTINEL_BIND_IP:-127.0.0.1}:9001:9001"
    volumes:
      - type: bind
        source: ./config
        target: /sentinel/config
        read_only: true
      - type: bind
        source: ./scripts/entrypoint.sh
        target: /sentinel/entrypoint.sh
        read_only: true
      - type: bind
        source: ./.secrets/runtime
        target: /sentinel/private
        read_only: true
        bind:
          create_host_path: false
      - mqtt-data:/mosquitto/data
    tmpfs:
      - /run/sentinel:mode=0700
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
volumes:
  mqtt-data:

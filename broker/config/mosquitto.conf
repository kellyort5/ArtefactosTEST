# Common auth policy deliberately applies to BOTH listeners.
user mosquitto
allow_anonymous false
password_file /run/sentinel/mosquitto.passwd
acl_file /run/sentinel/acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
log_dest stdout
log_type error
log_type warning
connection_messages false
max_packet_size 8192
message_size_limit 2048

listener 8883
protocol mqtt
certfile /run/sentinel/server.crt
keyfile /run/sentinel/server.key
tls_version tlsv1.2

listener 9001
protocol websockets
certfile /run/sentinel/server.crt
keyfile /run/sentinel/server.key
tls_version tlsv1.2

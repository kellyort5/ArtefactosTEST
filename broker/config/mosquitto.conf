# Common auth policy deliberately applies to BOTH listeners.
user mosquitto
allow_anonymous false
password_file /run/sentinel/mosquitto.passwd
acl_file /run/sentinel/acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
log_dest stdout
log_type error
log_type warning
connection_messages false
max_packet_size 8192
message_size_limit 2048

listener 1883
protocol mqtt

listener 9001
protocol websockets
